[project]
name = "cmmc-finetune-onnx"
version = "0.1.0"
description = "ONNX export and quantization of a merged model for transformers.js"
requires-python = ">=3.11"
# A separate environment: the ONNX exporter supports a different transformers
# range than the training environment. It reads only the merged safetensors
# directory. Commit uv.lock after the first successful export.
dependencies = [
    "optimum-onnx[onnxruntime]",
    "onnx",
    "onnxruntime",
    "onnxconverter-common",
    # The model builder for the q4f16 Llama exports (build_q4f16.py), the
    # tool behind the onnx-community Llama 3.2 q4f16 files.
    "onnxruntime-genai",
    # onnxruntime.quantization.matmul_nbits_quantizer (q4f16) imports it, but
    # onnxruntime does not declare it as a dependency.
    "onnx-ir",
    # onnx_float16.py (the transformers.js converter) imports its graph surgeon.
    "onnxslim",
    "torch",
    # transformers.js pins 2.2.6. onnx_float16.py calls np.fromstring and
    # ndarray.tostring, which NumPy 2.3 removed.
    "numpy==2.2.6",
]

[tool.uv]
package = false
